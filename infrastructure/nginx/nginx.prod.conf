# 운영(EC2) 전용 nginx 설정 — docker-compose.prod.yml 에서만 마운트한다.
# 로컬은 nginx.conf(단순 프록시)를 그대로 쓴다.

worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # Docker 내장 DNS를 사용한다. Gateway 복제본이 추가·교체되면
    # 컨테이너 IP를 다시 조회하여 upstream 목록을 갱신한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_max_body_size 1m;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_time=$request_time '
                    'upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream gateway_backend {
        zone gateway_backend 64k;
        least_conn;
        server gateway-service:19091 resolve;
        keepalive 256;
    }

    server {
        listen 80;
        server_name moneytown.shop www.moneytown.shop;

        # Let's Encrypt 인증서 발급·갱신 경로는 HTTPS로 넘기지 않는다.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # EC2/로드밸런서에서 Nginx 프로세스만 확인할 때 사용한다.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://www.moneytown.shop$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.moneytown.shop moneytown.shop;

        ssl_certificate     /etc/letsencrypt/live/moneytown.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/moneytown.shop/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Grafana 운영 대시보드는 /grafana/ 서브패스로만 공개한다.
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 모든 API 요청은 Gateway 복제본 중 현재 연결이 가장 적은 곳으로 전달한다.
        location / {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # 로그인 같은 POST 요청이 다른 Gateway로 자동 재전송되어
            # 중복 처리되는 일을 피하기 위해 Nginx 단계에서는 재시도하지 않는다.
            proxy_next_upstream off;
        }
    }
}

# 운영(EC2) 전용 nginx 설정 — docker-compose.prod.yml 에서만 마운트한다.
# 로컬은 nginx.conf(단순 프록시)를 그대로 쓴다.

events {}

http {
    server {
        listen 80;
        server_name moneytown.shop www.moneytown.shop;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.moneytown.shop$request_uri;
        }
    }

     server {
         listen 443 ssl;
         http2 on;
         server_name www.moneytown.shop moneytown.shop;

         ssl_certificate     /etc/letsencrypt/live/moneytown.shop/fullchain.pem;
         ssl_certificate_key /etc/letsencrypt/live/moneytown.shop/privkey.pem;

         ssl_protocols       TLSv1.2 TLSv1.3;
         ssl_prefer_server_ciphers off;
         ssl_session_cache   shared:SSL:10m;
         ssl_session_timeout 1d;

         # Grafana(운영 모니터링 대시보드) — analysis-service 담당자가 compose에 grafana 서비스를 올릴 예정.
         # 서비스명/포트가 grafana:3000이 아니면 proxy_pass만 맞춰 수정할 것.
         location /grafana/ {
             # TODO: 운영자 고정 IP가 정해지면 아래처럼 접근 제한 추가
             # allow <운영자 IP>;
             # deny all;

             proxy_pass http://grafana:3000;
             proxy_set_header Host              $host;
             proxy_set_header X-Real-IP         $remote_addr;
             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;

             # Grafana를 서브패스로 서빙하려면 grafana.ini에도
             # root_url = %(protocol)s://%(domain)s/grafana/
             # serve_from_sub_path = true
             # 를 맞춰야 로그인 후 리다이렉트·정적 리소스 경로가 깨지지 않는다.
         }

         location / {
             proxy_pass http://gateway-service:19091;
             proxy_set_header Host              $host;
             proxy_set_header X-Real-IP         $remote_addr;
             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
     }
}
# 운영(EC2) 오버레이 — 반드시 base 파일과 함께 사용한다.
#
#   docker compose --env-file .env \
#     -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.prod.yml up -d
#
# 이 파일이 하는 일은 세 가지뿐이다.
#   1) 호스트에 공개된 포트를 전부 닫는다 — 외부 진입점은 nginx 하나로 고정
#   2) 개발 편의용 GUI 컨테이너(kafka-ui, redisinsight)를 기동 대상에서 뺀다
#   3) nginx를 80으로 노출한다

services:

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  kafka:
    ports: !reset []

  discovery-server:
    ports: !reset []

  config-server:
    ports: !reset []

  gateway-service:
    ports: !reset []

  user-service:
    ports: !reset []

  wallet-service:
    ports: !reset []

  offering-service:
    ports: !reset []

  settlement-service:
    ports: !reset []

  analysis-service:
    ports: !reset []

  zipkin:
    ports: !reset []

  kafka-ui:
    profiles: ["dev-tools"]

  redisinsight:
    profiles: ["dev-tools"]

  nginx:
    ports: !override
      - "80:80"
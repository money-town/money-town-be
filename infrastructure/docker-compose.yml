name: money-town

x-app-common: &app-common
  restart: unless-stopped
  init: true
  networks: [moneytown]
  # 컨테이너 메모리 상한의 기본값. 서비스별로 필요하면 개별 override 한다.
  # ⚠️ 이 값이 없으면 JVM이 "컨테이너 상한"이 아니라 "호스트 전체 RAM"을 기준으로 힙을 잡는다.
  #    (32GB 맥에서는 JVM 하나가 8GB를 힙으로 예약) → 로컬 docker stats 실측치가
  #    EC2와 전혀 달라져서 인스턴스 사이징 근거로 쓸 수 없게 된다.
  mem_limit: 512m
  environment: &common-environment
    # 힙은 컨테이너 상한(mem_limit)의 비율로 잡는다 → 앞으로 mem_limit만 조절하면 힙도 따라 움직인다.
    # 나머지 35%는 힙 밖(metaspace·코드캐시·스레드스택·GC 구조체·다이렉트 버퍼) 몫으로 남긴다.
    # Dockerfile ENTRYPOINT가 `java -jar`라 JAVA_OPTS를 안 읽으므로 JAVA_TOOL_OPTIONS를 쓴다.
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${JVM_MAX_RAM_PERCENTAGE:-65}
    EUREKA_URL: http://discovery-server:19090/eureka
    CONFIG_SERVER_URL: http://config-server:19093
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    CORS_ALLOWED_ORIGIN_PATTERN: ${CORS_ALLOWED_ORIGIN_PATTERN:-http://localhost:*}
    POSTGRES_USER: ${POSTGRES_USER:-moneytown}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneytown}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}

services:
  postgres:
    image: pgvector/pgvector:pg18
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneytown}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneytown}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneytown} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [moneytown]

  redis:
    image: redis:7.4.7
    mem_limit: 256m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [moneytown]

  redisinsight:
    image: redis/redisinsight:2.56
    mem_limit: 256m
    ports:
      - "${REDISINSIGHT_HOST_PORT:-8001}:5540"
    volumes:
      - redisinsight-data:/data
    networks: [moneytown]

  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kafka도 JVM이다. 지정하지 않으면 호스트 RAM 기준으로 힙을 잡아 사이징이 흔들린다.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/localhost/29092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [moneytown]
    # 아직 실제 Kafka 프로듀서/컨슈머 서비스가 없어 토픽을 미리 만들어주는 kafka-init 컨테이너는 넣지 않았다

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: moneytown
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [moneytown]

  zipkin:
    image: openzipkin/zipkin:3.6.1
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
    mem_limit: 512m
    ports:
      - "${ZIPKIN_HOST_PORT:-9411}:9411"
    networks: [moneytown]

  discovery-server:
    <<: *app-common
    # Eureka 서버는 JPA/DB가 없어 도메인 서비스보다 가볍다
    mem_limit: 384m
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: discovery-server }
    ports: ["19090:19090"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    <<: *app-common
    # Config 서버도 JPA/DB가 없다
    mem_limit: 384m
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: config-server }
    environment:
      <<: *common-environment
      CONFIG_SEARCH_LOCATION: file:/config
    volumes:
      - ../config-repository:/config:ro
    ports: ["19093:19093"]
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    <<: *app-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: gateway-service }
    ports: ["19091:19091"]
    expose: ["9091"]
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      <<: *common-environment
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-money-town-user-service}



  nginx:
    image: nginx:1.31.3
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${NGINX_HOST_PORT:-8002}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-service:
        condition: service_healthy
    networks: [moneytown]



  user-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: user-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-money-town-user-service}
    ports: ["19092:19092"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19092/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  wallet-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: wallet-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
    ports: ["19094:19094"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19094/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  asset-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: asset-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/asset_db
    # 외부에서 내부 API를 직접 호출하지 못하도록 호스트 포트를 열지 않는다.
    expose: ["19095"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19095/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  offering-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: offering-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/offering_db
    ports: ["19096:19096"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19096/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  settlement-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: settlement-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/settlement_db
    ports: ["19097:19097"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19097/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  analysis-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: analysis-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://postgres:5432/analysis_db
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    ports: ["19098:19098"]
    depends_on:
      config-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19098/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  moneytown:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:
  kafka-data:

server:
  port: 19091

spring:
  cloud:
    gateway:
      server:
        webflux:
          # 각 도메인 서비스 뼈대 생성 시 여기에 라우트를 추가
          routes:
            # 실제 User API
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/kyc-verifications/**,/api/v1/issuer-applications/**

            # 실제 Wallet API
            - id: wallet-service-route
              uri: lb://wallet-service
              predicates:
                - Path=/api/v1/wallets/**

            # 실제 Asset API
            - id: asset-service-route
              uri: lb://asset-service
              predicates:
                - Path=/api/v1/assets/**,/api/v1/holdings/**

            # 실제 Offering API
            - id: offering-service-route
              uri: lb://offering-service
              predicates:
                - Path=/api/v1/offerings/**,/api/v1/subscriptions/**

            # 실제 Settlement API
            - id: settlement-service-route
              uri: lb://settlement-service
              predicates:
                - Path=/api/v1/settlements/**,/api/v1/final-settlements/**,/api/v1/dividends/**

            # 실제 Analysis API
            - id: analysis-service-route
              uri: lb://analysis-service
              predicates:
                - Path=/api/v1/analysis/**

            # User API 문서
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs

            # Wallet API 문서
            - id: wallet-service-api-docs
              uri: lb://wallet-service
              predicates:
                - Path=/api-docs/wallet-service
              filters:
                - SetPath=/v3/api-docs

            # Asset API 문서
            - id: asset-service-api-docs
              uri: lb://asset-service
              predicates:
                - Path=/api-docs/asset-service
              filters:
                - SetPath=/v3/api-docs

            # Offering API 문서
            - id: offering-service-api-docs
              uri: lb://offering-service
              predicates:
                - Path=/api-docs/offering-service
              filters:
                - SetPath=/v3/api-docs

            # Settlement API 문서
            - id: settlement-service-api-docs
              uri: lb://settlement-service
              predicates:
                - Path=/api-docs/settlement-service
              filters:
                - SetPath=/v3/api-docs

            # Analysis API 문서
            - id: analysis-service-api-docs
              uri: lb://analysis-service
              predicates:
                - Path=/api-docs/analysis-service
              filters:
                - SetPath=/v3/api-docs

          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                  - X-Correlation-Id
                allow-credentials: true
                max-age: 3600

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        # `gateway` 엔드포인트는 기본 노출에서 제외한다.
        # 라우트 조회뿐 아니라 POST로 라우트 추가/갱신/삭제가 가능해서,
        # 관리 포트(9091)가 어떤 이유로든 노출되면 라우팅을 통째로 바꿀 수 있다.
        include: ${MANAGEMENT_EXPOSURE_INCLUDE:health,info,prometheus}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /api-docs/user-service
#      - name: Wallet Service
#        url: /api-docs/wallet-service
#      - name: Asset Service
#        url: /api-docs/asset-service
#      - name: Offering Service
#        url: /api-docs/offering-service
#      - name: Settlement Service
#        url: /api-docs/settlement-service
#      - name: Analysis Service
#        url: /api-docs/analysis-service

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:money-town-user-service}
server:
  port: 19096

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offering_db}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${USER_SERVICE_READ_TIMEOUT:2000}

          analysis-service:
            connect-timeout: ${ANALYSIS_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${ANALYSIS_SERVICE_READ_TIMEOUT:2000}

          asset-service:
            connect-timeout: ${ASSET_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${ASSET_SERVICE_READ_TIMEOUT:2000}

subscription:
  reservation-timeout-minutes: ${SUBSCRIPTION_RESERVATION_TIMEOUT_MINUTES:10}
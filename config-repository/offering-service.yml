server:
  port: 19096

# HTTP 요청 시간 Histogram 활성화
management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[hikaricp.connections.acquire]": true
      slo:
        "[http.server.requests]": 100ms, 300ms, 1s, 3s
        "[hikaricp.connections.acquire]": 10ms, 50ms, 100ms, 500ms, 1s, 2s

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offering_db}
    hikari:
      connection-timeout: ${OFFERING_DB_CONNECTION_TIMEOUT:2000}

  flyway:
    postgresql:
      transactional-lock: false

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

        # Kafka가 메시지 전송 성공 여부를 확정할 최대 시간
        "[delivery.timeout.ms]": ${KAFKA_DELIVERY_TIMEOUT_MS:60000}

        # 메타데이터 조회 또는 Producer Buffer 확보 시
        # KafkaTemplate.send()가 동기적으로 대기할 최대 시간
        "[max.block.ms]": ${KAFKA_MAX_BLOCK_MS:5000}

    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record


  task:
    scheduling:
      pool:
        size: 4

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${USER_SERVICE_READ_TIMEOUT:2000}

          analysis-service:
            connect-timeout: ${ANALYSIS_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${ANALYSIS_SERVICE_READ_TIMEOUT:2000}

          asset-service:
            connect-timeout: ${ASSET_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${ASSET_SERVICE_READ_TIMEOUT:2000}

          wallet-service:
            connect-timeout: ${WALLET_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${WALLET_SERVICE_READ_TIMEOUT:2000}

# user-service 조회(투자 자격 검증)에만 서킷브레이커/벌크헤드를 적용한다.
# offering-service는 Feign 클라이언트가 5개(user/asset/analysis/holding/wallet)라
# feign.circuitbreaker.enabled 전역 스위치를 켜면 나머지 4개까지 전부 서킷브레이커로
# 감싸져 CallNotPermittedException이 기존 FeignException 처리 로직을 우회하게 된다.
# 그래서 전역 스위치 대신 CircuitBreakerRegistry/BulkheadRegistry를 user-service 호출부에서만 직접 사용한다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  # user-service의 HikariCP 풀(10개, wallet-service와 공유)이 offering-service 하나만으로
  # 소진되지 않도록 동시 호출 수를 제한한다. 대기 없이 즉시 거절(fail-fast)한다.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: ${USER_SERVICE_BULKHEAD_MAX_CONCURRENT_CALLS:8}
        max-wait-duration: 0
        permitted-number-of-calls-in-half-open-state: 5

subscription:
  reservation-timeout-minutes: ${SUBSCRIPTION_RESERVATION_TIMEOUT_MINUTES:10}

  timeout:
    batch-size: ${SUBSCRIPTION_TIMEOUT_BATCH_SIZE:100}
    max-batches-per-run: ${SUBSCRIPTION_TIMEOUT_MAX_BATCHES_PER_RUN:2}

  confirmation:
    batch-size: ${SUBSCRIPTION_CONFIRMATION_BATCH_SIZE:100}
    max-batches-per-run: ${SUBSCRIPTION_CONFIRMATION_MAX_BATCHES_PER_RUN:2}
    fixed-delay-ms: ${SUBSCRIPTION_CONFIRMATION_FIXED_DELAY_MS:1000}

  compensation:
    recovery:
      stuck-seconds: ${SUBSCRIPTION_COMPENSATION_RECOVERY_STUCK_SECONDS:300}
      batch-size: ${SUBSCRIPTION_COMPENSATION_RECOVERY_BATCH_SIZE:100}
      fixed-delay-ms: ${SUBSCRIPTION_COMPENSATION_RECOVERY_FIXED_DELAY_MS:30000}

  monitoring:
    refresh-delay-ms: ${SUBSCRIPTION_METRICS_REFRESH_DELAY_MS:10000}
    holding-allocation-stuck-seconds: ${HOLDING_ALLOCATION_STUCK_SECONDS:300}
    compensation-stuck-seconds: ${COMPENSATION_STUCK_SECONDS:300}

offering:
  cancellation:
    batch-size: ${OFFERING_CANCELLATION_BATCH_SIZE:100}
    fixed-delay-ms: ${OFFERING_CANCELLATION_FIXED_DELAY_MS:1000}

  ai-candidates:
    cache:
      ttl-seconds: ${OFFERING_AI_CANDIDATES_CACHE_TTL_SECONDS:5}
      maximum-size: ${OFFERING_AI_CANDIDATES_CACHE_MAXIMUM_SIZE:20}

outbox:
  publish:
    completion-timeout-seconds: ${OUTBOX_PUBLISH_COMPLETION_TIMEOUT_SECONDS:70}
    batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:20}
    fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:200}

    # 최초 발행을 포함한 최대 실패 허용 횟수
    max-failed-attempts: ${OUTBOX_PUBLISH_MAX_FAILED_ATTEMPTS:3}

    # 실패 횟수에 따라 10초, 20초 순서로 재시도한다.
    initial-retry-delay-seconds: ${OUTBOX_PUBLISH_INITIAL_RETRY_DELAY_SECONDS:10}
    retry-multiplier: ${OUTBOX_PUBLISH_RETRY_MULTIPLIER:2.0}
    max-retry-delay-seconds: ${OUTBOX_PUBLISH_MAX_RETRY_DELAY_SECONDS:60}

    # Kafka 결과가 확정되지 않은 PROCESSING 이벤트의 만료 및 복구 주기
    processing-timeout-seconds: ${OUTBOX_PUBLISH_PROCESSING_TIMEOUT_SECONDS:300}
    recovery-delay-ms: ${OUTBOX_PUBLISH_RECOVERY_DELAY_MS:30000}

    # Kafka 응답 대기 상태를 포함한 인스턴스당 최대 동시 발행 수
    max-in-flight: ${OUTBOX_PUBLISH_MAX_IN_FLIGHT:20}

    # KafkaTemplate.send() 최초 호출 전용 executor
    worker-pool-size: ${OUTBOX_PUBLISH_WORKER_POOL_SIZE:4}
    worker-queue-capacity: ${OUTBOX_PUBLISH_WORKER_QUEUE_CAPACITY:20}

    # Kafka 완료 결과 처리 executor
    callback-core-pool-size: ${OUTBOX_CALLBACK_CORE_POOL_SIZE:2}
    callback-max-pool-size: ${OUTBOX_CALLBACK_MAX_POOL_SIZE:4}
    callback-queue-capacity: ${OUTBOX_CALLBACK_QUEUE_CAPACITY:100}

  # PROCESSING 이벤트 건수를 DB에서 다시 조회하는 주기
  metrics:
    refresh-delay-ms: ${OUTBOX_METRICS_REFRESH_DELAY_MS:5000}

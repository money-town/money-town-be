server:
  port: 19098

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analysis_db}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analysis-fds
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

fds:
  pre:
    rules:
      RAPID_REQUEST:
        window-seconds: 1
        normal: 5
        suspicious: 3
      BURST_REQUEST:
        window-seconds: 10
        normal: 20
        suspicious: 10
      MULTI_OFFERING_BURST:
        window-seconds: 10
        normal: 5
        suspicious: 3
  post:
    rules:
      REPEATED_FAILURE:
        window-seconds: 60
        threshold: 8
      REPEATED_LIMIT_EXCEEDED:
        window-seconds: 60
        threshold: 5
      HIGH_CANCEL_RATE:
        sample-size: 10
        threshold: 4
  kafka:
    subscription-topic: subscription-events


notification:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}
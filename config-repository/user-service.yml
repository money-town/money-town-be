server:
  port: 19092
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 200
      min-spare: 20
    accept-count: 500
    max-connections: 1000

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

auth:
  login:
    password-verification:
      # 2 vCPU User Service 기준 BCrypt를 동시에 2개까지만 실행한다.
      max-concurrency: ${LOGIN_BCRYPT_MAX_CONCURRENCY:2}
      # 제한 안에 진입하지 못한 요청은 오래 쌓아두지 않고 429로 응답한다.
      acquire-timeout: ${LOGIN_BCRYPT_ACQUIRE_TIMEOUT:2s}

outbox:
  publish:
    batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:10}
    fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:1000}
    recovery-delay-ms: ${OUTBOX_PUBLISH_RECOVERY_DELAY_MS:30000}
    max-failed-attempts: ${OUTBOX_PUBLISH_MAX_FAILED_ATTEMPTS:3}
    retry-delay-seconds: ${OUTBOX_PUBLISH_RETRY_DELAY_SECONDS:30}
    processing-timeout-seconds: ${OUTBOX_PUBLISH_PROCESSING_TIMEOUT_SECONDS:300}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests:
          - 100ms
          - 300ms
          - 500ms
          - 1s

server:
  port: 19095

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asset_db}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:moneytown-asset}

outbox:
  publish:
    batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:20}
    fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:200}
    max-in-flight: ${OUTBOX_PUBLISH_MAX_IN_FLIGHT:20}
    worker-pool-size: ${OUTBOX_PUBLISH_WORKER_POOL_SIZE:4}
    worker-queue-capacity: ${OUTBOX_PUBLISH_WORKER_QUEUE_CAPACITY:20}
    callback-core-pool-size: ${OUTBOX_CALLBACK_CORE_POOL_SIZE:2}
    callback-max-pool-size: ${OUTBOX_CALLBACK_MAX_POOL_SIZE:4}
    callback-queue-capacity: ${OUTBOX_CALLBACK_QUEUE_CAPACITY:100}
    max-failed-attempts: ${OUTBOX_PUBLISH_MAX_FAILED_ATTEMPTS:3}
    retry-delay-seconds: ${OUTBOX_PUBLISH_RETRY_DELAY_SECONDS:30}
    processing-timeout-seconds: ${OUTBOX_PROCESSING_TIMEOUT_SECONDS:300}
    recovery-delay-ms: ${OUTBOX_RECOVERY_DELAY_MS:30000}

  metrics:
    refresh-delay-ms: ${OUTBOX_METRICS_REFRESH_DELAY_MS:5000}

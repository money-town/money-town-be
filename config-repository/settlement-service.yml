server:
  port: 19097

spring:
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          # 타임아웃은 지급 경로에만 건다 — asset·analysis는 기본값(connect 10s / read 60s) 유지
          wallet-service:
            connect-timeout: ${WALLET_SERVICE_CONNECT_TIMEOUT:1000}
            read-timeout: ${WALLET_SERVICE_READ_TIMEOUT:3000}
      # 서킷브레이커는 OpenFeign 설정이 클라이언트 단위 on/off를 지원하지 않아 세 클라이언트 전역으로 켜진다
      circuitbreaker:
        enabled: true
    circuitbreaker:
      resilience4j:
        # 기본값 TimeLimiter(1초)가 Feign read-timeout(3초)보다 먼저 호출을 끊는 것을 막는다 — 시간 제한은 Feign 타임아웃 하나만 쓴다
        disable-time-limiter: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement_db}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # Consumer 전용이라도 DLT 발행(DeadLetterPublishingRecoverer)이 내부적으로
    # Kafka Producer를 쓰므로 producer 블록도 포함
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

# 서킷브레이커
# wallet-service.yml의 값을 그대로 쓰면 단일 워커가 3초 타임아웃으로 순차 호출하는 정산에서는
# 서킷이 열리기까지 약 60초(20×3초)가 걸리므로, 윈도우와 최소 호출 수를 5로 줄였다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5